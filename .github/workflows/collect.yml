# 3일마다 기사를 모읍니다. 사이트에 올리지는 않습니다.
# 올리는 것은 승인.txt 를 고칠 때만 일어납니다 (publish.yml).
name: 3일마다 수집

on:
  schedule:
    # UTC 기준입니다. 21:00 UTC = 한국시간 다음날 오전 6시.
    # 3,6,9,...,30일 오전 6시에 돌아갑니다.
    - cron: "0 21 2,5,8,11,14,17,20,23,26,29 * *"
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로 돌릴 수도 있습니다

permissions:
  contents: write

concurrency:
  group: jimin-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 필요한 것 설치
        run: pip install requests

      - name: 기사 모으기
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: python 수집.py

      - name: 검수 화면 다시 만들기
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: python 만들기.py

      - name: 저장
        run: |
          B="${GITHUB_REF_NAME}"
          git config user.name  "지민뉴스 자동수집"
          git config user.email "actions@github.com"

          # 파이썬이 남기는 찌꺼기는 저장소에 들어가면 안 됩니다.
          # 이게 들어가면 나중에 합칠 수 없는 충돌이 납니다.
          rm -rf __pycache__
          git rm -r --cached __pycache__ --ignore-unmatch -q || true

          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git commit -q -m "수집 $(date -u +%Y-%m-%d)"

          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$B"; then
              echo "저장했습니다."
              exit 0
            fi
            echo "저장소가 먼저 바뀌었습니다 — 다시 맞춰서 시도합니다 ($i/5)"

            # 여기서 만드는 파일은 전부 '프로그램이 뱉은 결과물'입니다.
            # 사람이 쓴 글이 아니라 합치는 것 자체가 의미가 없고,
            # 방금 만든 것이 가장 최신입니다. 그래서 원격 위에 그대로 얹습니다.
            rm -rf /tmp/새것
            mkdir -p /tmp/새것
            for f in 후보.json docs; do
              if [ -e "$f" ]; then cp -r "$f" /tmp/새것/; fi
            done

            git fetch -q origin "$B"
            git reset -q --hard "origin/$B"

            for f in 후보.json docs; do
              if [ -e "/tmp/새것/$f" ]; then rm -rf "$f"; cp -r "/tmp/새것/$f" .; fi
            done
            rm -rf __pycache__
            git rm -r --cached __pycache__ --ignore-unmatch -q || true

            git add -A
            if git diff --staged --quiet; then
              echo "이미 반영돼 있습니다."
              exit 0
            fi
            git commit -q -m "수집 $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "다섯 번 시도했지만 저장하지 못했습니다."
          exit 1
