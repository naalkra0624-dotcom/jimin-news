# 3일마다 기사를 모읍니다. 사이트에 올리지는 않습니다.
# 올리는 것은 승인.txt 를 고칠 때만 일어납니다 (publish.yml).
name: 3일마다 수집

on:
  schedule:
    # UTC 기준입니다. 21:00 UTC = 한국시간 다음날 오전 6시.
    # 3,6,9,...,30일 오전 6시에 돌아갑니다.
    - cron: "0 21 2,5,8,11,14,17,20,23,26,29 * *"
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로 돌릴 수도 있습니다

permissions:
  contents: write

concurrency:
  group: jimin-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 것 설치
        run: pip install requests

      - name: 기사 모으기
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          PYTHONIOENCODING: utf-8
        run: python 수집.py

      - name: 검수 화면 다시 만들기
        env:
          PYTHONIOENCODING: utf-8
        run: python 만들기.py

      - name: 저장
        run: |
          git config user.name  "지민뉴스 자동수집"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 것이 없습니다."
          else
            git commit -m "수집 $(date -u +%Y-%m-%d)"
            git push
          fi
