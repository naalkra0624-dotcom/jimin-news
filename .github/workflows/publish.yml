# 승인.txt 를 고치면 사이트를 다시 만듭니다.
# 기사를 새로 모으지 않으므로 돈이 들지 않고 몇 초면 끝납니다.
name: 승인하면 발행

on:
  push:
    paths:
      - "승인.txt"
      - "만들기.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jimin-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 사이트 만들기
        env:
          PYTHONIOENCODING: utf-8
        run: python 만들기.py

      - name: 저장
        run: |
          git config user.name  "지민뉴스 자동발행"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git commit -m "발행 $(date -u +%Y-%m-%d\ %H:%M)"
          # 밀어 넣는 사이에 저장소가 먼저 바뀔 수 있습니다.
          # (검수 커밋과 자동 수집이 겹칠 때) 그럴 땐 받아서 다시 얹고 재시도합니다.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "저장했습니다."
              exit 0
            fi
            echo "저장소가 먼저 바뀌었습니다 — 다시 맞춰서 시도합니다 ($i/5)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          echo "다섯 번 시도했지만 저장하지 못했습니다."
          exit 1
